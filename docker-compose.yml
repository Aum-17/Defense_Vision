services:
  db:
    image: postgis/postgis:16-3.4
    container_name: defencevision-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-defence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-defence}
      POSTGRES_DB: ${POSTGRES_DB:-defencevision}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-defence} -d ${POSTGRES_DB:-defencevision}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: defencevision-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://defence:defence@db:5432/defencevision}
      DATA_ROOT: /app/data
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    container_name: defencevision-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
